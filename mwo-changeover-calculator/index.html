<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Shift Changeover Calculator</title>
<meta name="description" content="Find the split (change) time for a split shift: shift start is first brief minus 2h 30m, split is the midpoint to last land.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1020'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%235eead4' stroke-width='2'/%3E%3Cpath d='M16 7v9l6.5 3.5' fill='none' stroke='%23a5b4fc' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b1020;
    --panel: rgba(30, 41, 59, 0.72);
    --panel-2: rgba(39, 52, 73, 0.65);
    --accent: #5eead4;
    --accent-2: #818cf8;
    --accent-strong: #2dd4bf;
    --text: #e9eef7;
    --muted: #9fb0cc;
    --error: #fb7185;
    --good: #4ade80;
    --note: #fbbf24;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(129, 140, 248, 0.35), transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, rgba(45, 212, 191, 0.30), transparent 55%),
      radial-gradient(900px 900px at 50% 120%, rgba(236, 72, 153, 0.22), transparent 60%),
      linear-gradient(160deg, #0b1020 0%, #131a36 45%, #0d1430 100%);
    background-attachment: fixed;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 480px; height: 480px;
    top: -120px; left: -100px;
    background: radial-gradient(circle at 30% 30%, #818cf8, transparent 70%);
    animation: drift1 18s ease-in-out infinite alternate;
  }
  body::after {
    width: 520px; height: 520px;
    bottom: -160px; right: -120px;
    background: radial-gradient(circle at 70% 70%, #2dd4bf, transparent 70%);
    animation: drift2 22s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(60px, 40px) scale(1.15); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-50px, -30px) scale(1.1); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 20px;
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    overflow: hidden;
  }

  .card::before {
    content: "";
    display: block;
    height: 4px;
    width: 100%;
    background: linear-gradient(90deg, #818cf8, #2dd4bf, #f472b6, #818cf8);
    background-size: 300% 100%;
    animation: sweep 8s linear infinite;
  }
  @keyframes sweep {
    from { background-position: 0% 0; }
    to   { background-position: 300% 0; }
  }

  header {
    padding: 26px 32px 20px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
    font-weight: 800;
    background: linear-gradient(90deg, #a5b4fc, #5eead4 60%, #fda4af);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.45;
  }

  .body { padding: 28px 32px 32px; }

  .field-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  .field {
    flex: 1 1 180px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
  }

  input[type="time"] {
    background: var(--panel-2);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 12px;
    color: var(--text);
    font-size: 1.1rem;
    padding: 12px 14px;
    width: 100%;
    min-height: 48px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    color-scheme: dark;
  }
  input[type="time"]::-webkit-calendar-picker-indicator {
    filter: invert(0.8) brightness(1.4);
    cursor: pointer;
  }

  input[type="time"]:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(45, 212, 191, 0.08);
    box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.22);
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  button {
    background: linear-gradient(135deg, #6366f1, #2dd4bf);
    color: #04122a;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 26px;
    min-height: 48px;
    cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 22px rgba(45, 212, 191, 0.28);
    transition: transform 0.06s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  button:hover { filter: brightness(1.08); box-shadow: 0 10px 28px rgba(99, 102, 241, 0.4); }
  button:active { transform: translateY(1px); }

  .quiet-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.9rem;
    user-select: none;
    cursor: pointer;
  }
  .quiet-toggle input { width: 16px; height: 16px; accent-color: var(--accent-strong); }

  .engine {
    margin-top: 12px;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .engine strong { color: var(--accent); font-weight: 700; }

  .output {
    margin-top: 26px;
    min-height: 40px;
  }

  .error {
    color: var(--error);
    background: rgba(251, 113, 133, 0.12);
    border: 1px solid rgba(251, 113, 133, 0.4);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.95rem;
  }

  .breakdown {
    background: linear-gradient(180deg, rgba(39, 52, 73, 0.7), rgba(30, 41, 59, 0.55));
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 14px;
    overflow: hidden;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
  }
  .row:last-child { border-bottom: none; }

  .row .lbl { color: var(--muted); font-size: 0.85rem; }
  .row .val {
    font-variant-numeric: tabular-nums;
    font-size: 1.05rem;
    font-weight: 600;
    text-align: right;
  }
  .row .formula {
    display: block;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 400;
    margin-top: 2px;
  }
  .row .note { color: var(--note); font-size: 0.72rem; font-weight: 400; }

  .split-row {
    background: linear-gradient(90deg, rgba(129, 140, 248, 0.18), rgba(45, 212, 191, 0.18));
  }
  .split-row .val {
    font-size: 1.3rem;
    background: linear-gradient(90deg, #a5b4fc, #5eead4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .quiet-result {
    text-align: center;
    font-size: 2.6rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    padding: 28px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.18), rgba(45, 212, 191, 0.16));
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 14px;
  }
  .quiet-result .clock {
    background: linear-gradient(90deg, #a5b4fc, #5eead4 60%, #fda4af);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .quiet-result small {
    display: block;
    font-size: 0.9rem;
    color: var(--note);
    font-weight: 500;
    margin-top: 6px;
  }

  @media (max-width: 420px) {
    header, .body { padding-left: 20px; padding-right: 20px; }
    .quiet-result { font-size: 2.1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before, body::after, .card::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Split Shift Changeover Calculator</h1>
      <p>
        Shift start = first brief time &minus; 2&nbsp;h&nbsp;30&nbsp;m.<br>
        Split time = the exact midpoint between shift start and last land time.
      </p>
    </header>

    <div class="body">
      <div class="field-row">
        <div class="field">
          <label for="firstBrief">First brief (HH:MM)</label>
          <input type="time" id="firstBrief" value="06:00">
        </div>
        <div class="field">
          <label for="lastLand">Last land (HH:MM)</label>
          <input type="time" id="lastLand" value="22:00">
        </div>
      </div>

      <div class="controls">
        <button id="calcBtn" type="button">Calculate</button>
        <label class="quiet-toggle">
          <input type="checkbox" id="quiet">
          Show Split Only
        </label>
      </div>

      <p class="engine" id="engine" aria-live="polite">Engine: loading Python&hellip;</p>
      <div class="output" id="output" aria-live="polite"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
<script>
  "use strict";

  const SHIFT_LEAD_MIN = 150;
  const DAY_MIN = 24 * 60;

  let pyReady = null;
  let pyodide = null;
  let engineName = "js";

  function parseTime(str) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(str).trim());
    if (!m) return null;
    const h = parseInt(m[1], 10);
    const mins = parseInt(m[2], 10);
    if (h > 23 || mins > 59) return null;
    return h * 60 + mins;
  }

  function fmtHM(totalMinutes) {
    const total = Math.floor(totalMinutes);
    const h = Math.floor(total / 60);
    const m = total % 60;
    return h + "h " + String(m).padStart(2, "0") + "m";
  }

  function fmtClock(absMinutes) {
    const dayOffset = Math.floor(absMinutes / DAY_MIN);
    const within = absMinutes - dayOffset * DAY_MIN;
    const h = Math.floor(within / 60);
    const m = Math.floor(within % 60);
    let s = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    if (dayOffset > 0) s += " (+1 day)";
    else if (dayOffset < 0) s += " (-1 day)";
    return s;
  }

  function computeJs(firstBriefStr, lastLandStr) {
    const brief = parseTime(firstBriefStr);
    const land = parseTime(lastLandStr);
    if (brief === null) throw new Error("Invalid time format: " + firstBriefStr + ". Use HH:MM (24-hour).");
    if (land === null) throw new Error("Invalid time format: " + lastLandStr + ". Use HH:MM (24-hour).");

    let landAbs = land;
    const overnight = landAbs < brief;
    if (overnight) landAbs += DAY_MIN;

    const startAbs = brief - SHIFT_LEAD_MIN;
    const total = landAbs - startAbs;
    if (total <= 0) throw new Error("Last land time must occur after the calculated shift start.");

    const half = total / 2;
    const splitAbs = startAbs + half;
    const splitDayOffset = Math.floor(splitAbs / DAY_MIN);
    const splitClock = fmtClock(splitAbs).replace(/\s*\(.*\)$/, "");
    let splitQuiet = splitClock;
    if (splitDayOffset > 0) splitQuiet += " (next day)";
    else if (splitDayOffset < 0) splitQuiet += " (previous day)";

    return {
      ok: true,
      overnight,
      firstBrief: fmtClock(brief),
      shiftStart: fmtClock(startAbs),
      lastLand: fmtClock(landAbs),
      totalSpan: fmtHM(total),
      halfSpan: fmtHM(half),
      splitTime: fmtClock(splitAbs),
      splitClock,
      splitDayOffset,
      splitQuiet
    };
  }

  async function bootPython() {
    if (typeof loadPyodide !== "function") throw new Error("Pyodide not available");
    const py = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.5/full/"
    });
    const src = await fetch("calculate_changeover.py").then(function (r) {
      if (!r.ok) throw new Error("Could not load calculate_changeover.py");
      return r.text();
    });
    py.FS.writeFile("calculate_changeover.py", src);
    await py.runPythonAsync([
      "import importlib.util, sys",
      "spec = importlib.util.spec_from_file_location('changeover', 'calculate_changeover.py')",
      "mod = importlib.util.module_from_spec(spec)",
      "sys.modules['changeover'] = mod",
      "spec.loader.exec_module(mod)"
    ].join("\n"));
    pyodide = py;
    engineName = "python";
  }

  function computePython(firstBriefStr, lastLandStr) {
    const payload = pyodide.runPython(
      "import json, changeover\n" +
      "r = changeover.compute(" + JSON.stringify(firstBriefStr) + ", " + JSON.stringify(lastLandStr) + ")\n" +
      "json.dumps(changeover.result_payload(r))"
    );
    return JSON.parse(payload);
  }

  async function compute(firstBriefStr, lastLandStr) {
    if (engineName === "python" && pyodide) {
      return computePython(firstBriefStr, lastLandStr);
    }
    return computeJs(firstBriefStr, lastLandStr);
  }

  function renderBreakdown(r) {
    const landNote = r.overnight
      ? '<span class="note"> (rolled to next day &mdash; overnight shift)</span>'
      : "";
    return (
      '<div class="breakdown">' +
        '<div class="row"><span class="lbl">First brief</span><span class="val">' + r.firstBrief + "</span></div>" +
        '<div class="row"><span class="lbl">Shift start</span><span class="val">' + r.shiftStart +
          '<span class="formula">first brief &minus; 2h 30m</span></span></div>' +
        '<div class="row"><span class="lbl">Last land</span><span class="val">' + r.lastLand + landNote + "</span></div>" +
        '<div class="row"><span class="lbl">Total span</span><span class="val">' + r.totalSpan +
          '<span class="formula">last land &minus; shift start</span></span></div>' +
        '<div class="row"><span class="lbl">Half span</span><span class="val">' + r.halfSpan +
          '<span class="formula">total span / 2</span></span></div>' +
        '<div class="row split-row"><span class="lbl">Split time</span><span class="val">' + r.splitTime +
          '<span class="formula">shift start + half span</span></span></div>' +
      "</div>"
    );
  }

  function renderQuiet(r) {
    let note = "";
    if (r.splitDayOffset > 0) note = "<small>next day</small>";
    else if (r.splitDayOffset < 0) note = "<small>previous day</small>";
    return '<div class="quiet-result"><span class="clock">' + r.splitClock + "</span>" + note + "</div>";
  }

  function setEngineLabel() {
    const el = document.getElementById("engine");
    if (engineName === "python") {
      el.innerHTML = "Engine: <strong>Python</strong> · calculate_changeover.py";
    } else {
      el.innerHTML = "Engine: <strong>JS fallback</strong> (Python loading&hellip;)";
    }
  }

  async function run() {
    const output = document.getElementById("output");
    const quiet = document.getElementById("quiet").checked;
    const brief = document.getElementById("firstBrief").value;
    const land = document.getElementById("lastLand").value;
    setEngineLabel();
    try {
      const result = await compute(brief, land);
      output.innerHTML = quiet ? renderQuiet(result) : renderBreakdown(result);
    } catch (e) {
      const msg = (e && e.message) ? e.message : String(e);
      output.innerHTML = '<div class="error">Error: ' + msg + "</div>";
    }
  }

  document.getElementById("calcBtn").addEventListener("click", run);
  document.getElementById("quiet").addEventListener("change", run);
  ["firstBrief", "lastLand"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", run);
  });

  run();

  pyReady = bootPython()
    .then(function () {
      setEngineLabel();
      return run();
    })
    .catch(function () {
      engineName = "js";
      document.getElementById("engine").innerHTML =
        "Engine: <strong>JS fallback</strong> (matches calculate_changeover.py)";
    });
</script>
</body>
</html>

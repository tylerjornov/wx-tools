<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Shift Changeover Calculator</title>
<meta name="description" content="Find the split (change) time for a split shift: shift start is first brief minus 2h 30m, split is the midpoint to last land.">
<meta name="theme-color" content="#161826">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161826'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%239184d9' stroke-width='1.75'/%3E%3Cpath d='M16 8v8l5.5 3' fill='none' stroke='%23a7a1db' stroke-width='1.75' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #161826;
    --surface: #232532;
    --text: #e9e9ed;
    --accent: #9184d9;
    --accent-2: #a7a1db;
    --muted: #9397ab;
    --divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --error: #e08b8b;
    --shadow: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
    --shadow-sm: 0 0 0 1px #3f424d;
    --input: #1c1e2a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    font-family: "Inter", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    font-weight: 400;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 16px;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

  .shell {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .back {
    color: color-mix(in srgb, var(--text) 55%, transparent);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-decoration: none;
    padding: 6px 2px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .back::before { content: "←"; color: var(--accent); font-size: 0.95rem; }
  .back:hover { color: var(--text); }

  .card {
    width: 100%;
    background: var(--surface);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  header { padding: 22px 24px 16px; }
  header::after {
    content: "";
    display: block;
    height: 1px;
    margin: 16px -24px 0;
    background: linear-gradient(to right, transparent, var(--divider) 48px, var(--divider) calc(100% - 48px), transparent);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 25px;
    font-weight: 500;
    line-height: 1.12;
    letter-spacing: -0.015em;
    color: var(--text);
  }
  header p {
    margin: 0;
    color: color-mix(in srgb, var(--text) 55%, transparent);
    font-size: 14px;
    line-height: 1.45;
  }

  .body { padding: 20px 24px 24px; }

  .field-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { flex: 1 1 180px; display: flex; flex-direction: column; gap: 5px; }
  label {
    font-size: 12px;
    color: color-mix(in srgb, var(--text) 70%, transparent);
  }
  input[type="time"] {
    background: var(--input);
    border: 1px solid var(--divider);
    border-radius: 8px;
    color: var(--text);
    caret-color: var(--accent);
    font-family: inherit;
    font-size: 14px;
    padding: 6px 10px;
    width: 100%;
    min-height: 44px;
    color-scheme: dark;
    transition: border-color 0.16s ease;
  }
  input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.7; }
  input[type="time"]:hover { border-color: color-mix(in srgb, var(--text) 45%, transparent); }
  input[type="time"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.2;
    padding: 10px 18px;
    min-height: 44px;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: background 0.16s ease;
  }
  button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  button:active { background: color-mix(in srgb, var(--accent) 22%, transparent); }

  .quiet-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    color: color-mix(in srgb, var(--text) 70%, transparent);
    font-size: 14px;
    user-select: none;
    cursor: pointer;
    min-height: 44px;
  }
  .quiet-toggle input { width: 16px; height: 16px; accent-color: var(--accent); }

  .engine {
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: color-mix(in srgb, var(--text) 50%, transparent);
  }
  .engine strong { color: var(--accent); font-weight: 500; }

  .output { margin-top: 20px; min-height: 40px; }

  .error {
    color: var(--error);
    background: color-mix(in srgb, var(--error) 12%, transparent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--error) 35%, transparent);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
  }

  .breakdown {
    background: color-mix(in srgb, var(--text) 4%, var(--surface));
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 11px 16px;
    background: linear-gradient(to right, transparent, color-mix(in srgb, var(--text) 8%, transparent) 48px, color-mix(in srgb, var(--text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;
  }
  .row:last-child { background: none; }
  .row .lbl { color: color-mix(in srgb, var(--text) 55%, transparent); font-size: 13px; }
  .row .val {
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 500;
    text-align: right;
  }
  .row .formula {
    display: block;
    color: color-mix(in srgb, var(--text) 45%, transparent);
    font-size: 11px;
    font-weight: 400;
    margin-top: 2px;
  }
  .row .note { color: var(--accent-2); font-size: 11px; font-weight: 400; }

  .split-row { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .split-row .val { font-size: 20px; color: var(--accent); }

  .quiet-result {
    text-align: center;
    font-size: 42px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    padding: 22px;
    background: color-mix(in srgb, var(--accent) 10%, var(--surface));
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
  }
  .quiet-result .clock { color: var(--accent); }
  .quiet-result small {
    display: block;
    font-size: 13px;
    color: var(--accent-2);
    font-weight: 400;
    letter-spacing: 0;
    margin-top: 6px;
  }

  @media (max-width: 420px) {
    header, .body { padding-left: 18px; padding-right: 18px; }
    .quiet-result { font-size: 32px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <a class="back" href="../">wx-tools</a>
  <div class="card">
    <header>
      <h1>Split Shift Changeover Calculator</h1>
      <p>
        Shift start = first brief time &minus; 2&nbsp;h&nbsp;30&nbsp;m.<br>
        Split time = the exact midpoint between shift start and last land time.
      </p>
    </header>

    <div class="body">
      <div class="field-row">
        <div class="field">
          <label for="firstBrief">First brief (HH:MM)</label>
          <input type="time" id="firstBrief">
        </div>
        <div class="field">
          <label for="lastLand">Last land (HH:MM)</label>
          <input type="time" id="lastLand">
        </div>
      </div>

      <div class="controls">
        <button id="calcBtn" type="button">Calculate</button>
        <label class="quiet-toggle">
          <input type="checkbox" id="quiet">
          Show Split Only
        </label>
      </div>

      <p class="engine" id="engine" aria-live="polite">Engine: loading Python&hellip;</p>
      <div class="output" id="output" aria-live="polite"></div>
    </div>
  </div>
  </div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
<script>
  "use strict";

  const SHIFT_LEAD_MIN = 150;
  const DAY_MIN = 24 * 60;

  let pyReady = null;
  let pyodide = null;
  let engineName = "js";

  function parseTime(str) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(str).trim());
    if (!m) return null;
    const h = parseInt(m[1], 10);
    const mins = parseInt(m[2], 10);
    if (h > 23 || mins > 59) return null;
    return h * 60 + mins;
  }

  function fmtHM(totalMinutes) {
    const total = Math.floor(totalMinutes);
    const h = Math.floor(total / 60);
    const m = total % 60;
    return h + "h " + String(m).padStart(2, "0") + "m";
  }

  function fmtClock(absMinutes) {
    const dayOffset = Math.floor(absMinutes / DAY_MIN);
    const within = absMinutes - dayOffset * DAY_MIN;
    const h = Math.floor(within / 60);
    const m = Math.floor(within % 60);
    let s = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    if (dayOffset > 0) s += " (+1 day)";
    else if (dayOffset < 0) s += " (-1 day)";
    return s;
  }

  function computeJs(firstBriefStr, lastLandStr) {
    const brief = parseTime(firstBriefStr);
    const land = parseTime(lastLandStr);
    if (brief === null) throw new Error("Invalid time format: " + firstBriefStr + ". Use HH:MM (24-hour).");
    if (land === null) throw new Error("Invalid time format: " + lastLandStr + ". Use HH:MM (24-hour).");

    let landAbs = land;
    const overnight = landAbs < brief;
    if (overnight) landAbs += DAY_MIN;

    const startAbs = brief - SHIFT_LEAD_MIN;
    const total = landAbs - startAbs;
    if (total <= 0) throw new Error("Last land time must occur after the calculated shift start.");

    const half = total / 2;
    const splitAbs = startAbs + half;
    const splitDayOffset = Math.floor(splitAbs / DAY_MIN);
    const splitClock = fmtClock(splitAbs).replace(/\s*\(.*\)$/, "");
    let splitQuiet = splitClock;
    if (splitDayOffset > 0) splitQuiet += " (next day)";
    else if (splitDayOffset < 0) splitQuiet += " (previous day)";

    return {
      ok: true,
      overnight,
      firstBrief: fmtClock(brief),
      shiftStart: fmtClock(startAbs),
      lastLand: fmtClock(landAbs),
      totalSpan: fmtHM(total),
      halfSpan: fmtHM(half),
      splitTime: fmtClock(splitAbs),
      splitClock,
      splitDayOffset,
      splitQuiet
    };
  }

  async function bootPython() {
    if (typeof loadPyodide !== "function") throw new Error("Pyodide not available");
    const py = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.5/full/"
    });
    const src = await fetch("calculate_changeover.py").then(function (r) {
      if (!r.ok) throw new Error("Could not load calculate_changeover.py");
      return r.text();
    });
    py.FS.writeFile("calculate_changeover.py", src);
    await py.runPythonAsync([
      "import importlib.util, sys",
      "spec = importlib.util.spec_from_file_location('changeover', 'calculate_changeover.py')",
      "mod = importlib.util.module_from_spec(spec)",
      "sys.modules['changeover'] = mod",
      "spec.loader.exec_module(mod)"
    ].join("\n"));
    pyodide = py;
    engineName = "python";
  }

  function computePython(firstBriefStr, lastLandStr) {
    const payload = pyodide.runPython(
      "import json, changeover\n" +
      "r = changeover.compute(" + JSON.stringify(firstBriefStr) + ", " + JSON.stringify(lastLandStr) + ")\n" +
      "json.dumps(changeover.result_payload(r))"
    );
    return JSON.parse(payload);
  }

  async function compute(firstBriefStr, lastLandStr) {
    if (engineName === "python" && pyodide) {
      return computePython(firstBriefStr, lastLandStr);
    }
    return computeJs(firstBriefStr, lastLandStr);
  }

  function renderBreakdown(r) {
    const landNote = r.overnight
      ? '<span class="note"> (rolled to next day &mdash; overnight shift)</span>'
      : "";
    return (
      '<div class="breakdown">' +
        '<div class="row"><span class="lbl">First brief</span><span class="val">' + r.firstBrief + "</span></div>" +
        '<div class="row"><span class="lbl">Shift start</span><span class="val">' + r.shiftStart +
          '<span class="formula">first brief &minus; 2h 30m</span></span></div>' +
        '<div class="row"><span class="lbl">Last land</span><span class="val">' + r.lastLand + landNote + "</span></div>" +
        '<div class="row"><span class="lbl">Total span</span><span class="val">' + r.totalSpan +
          '<span class="formula">last land &minus; shift start</span></span></div>' +
        '<div class="row"><span class="lbl">Half span</span><span class="val">' + r.halfSpan +
          '<span class="formula">total span / 2</span></span></div>' +
        '<div class="row split-row"><span class="lbl">Split time</span><span class="val">' + r.splitTime +
          '<span class="formula">shift start + half span</span></span></div>' +
      "</div>"
    );
  }

  function renderQuiet(r) {
    let note = "";
    if (r.splitDayOffset > 0) note = "<small>next day</small>";
    else if (r.splitDayOffset < 0) note = "<small>previous day</small>";
    return '<div class="quiet-result"><span class="clock">' + r.splitClock + "</span>" + note + "</div>";
  }

  function setEngineLabel() {
    const el = document.getElementById("engine");
    if (engineName === "python") {
      el.innerHTML = "Engine: <strong>Python</strong> · calculate_changeover.py";
    } else {
      el.innerHTML = "Engine: <strong>JS fallback</strong> (Python loading&hellip;)";
    }
  }

  async function run() {
    const output = document.getElementById("output");
    const quiet = document.getElementById("quiet").checked;
    const brief = document.getElementById("firstBrief").value;
    const land = document.getElementById("lastLand").value;
    if (!brief || !land) {
      output.innerHTML = "";
      return;
    }
    setEngineLabel();
    try {
      const result = await compute(brief, land);
      output.innerHTML = quiet ? renderQuiet(result) : renderBreakdown(result);
    } catch (e) {
      const msg = (e && e.message) ? e.message : String(e);
      output.innerHTML = '<div class="error">Error: ' + msg + "</div>";
    }
  }

  document.getElementById("calcBtn").addEventListener("click", run);
  document.getElementById("quiet").addEventListener("change", run);
  ["firstBrief", "lastLand"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", run);
  });

  run();

  pyReady = bootPython()
    .then(function () {
      setEngineLabel();
      return run();
    })
    .catch(function () {
      engineName = "js";
      document.getElementById("engine").innerHTML =
        "Engine: <strong>JS fallback</strong> (matches calculate_changeover.py)";
    });
</script>
</body>
</html>

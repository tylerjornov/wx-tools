<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./dist/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="1W051 weather standby console — METAR/TAF board, mission thresholds, WWA log, and brief builder."
    />
    <title>1W051 Stand-By Console</title>
    <script>
      // GitHub Pages cannot use the Vite AWC proxy. Rewrite those calls
      // through CORS-enabled NWS / IEM endpoints and keep AWC JSON shape.
      (() => {
        const orig = window.fetch.bind(window);
        const json = (data, status = 200) =>
          new Response(JSON.stringify(data), {
            status,
            headers: { "Content-Type": "application/json" },
          });
        const v = (o) => (o && typeof o === "object" && "value" in o ? o.value : null);
        const idsOf = (url) =>
          new URL(url, location.href).searchParams.get("ids") || "";

        function altimFromRaw(raw) {
          const m = /A(\d{4})/.exec(raw || "");
          return m ? Number(m[1]) / 100 : null;
        }

        async function metars(ids) {
          const list = ids.split(",").map((s) => s.trim().toUpperCase()).filter(Boolean);
          const rows = await Promise.all(
            list.map(async (id) => {
              const r = await orig(
                `https://api.weather.gov/stations/${id}/observations/latest`,
                { headers: { Accept: "application/geo+json" } },
              );
              if (!r.ok) return null;
              const j = await r.json();
              const p = j.properties || {};
              const raw = p.rawMessage || "";
              const visM = v(p.visibility);
              let visib = visM == null ? null : Number((visM / 1609.344).toFixed(1));
              if (visib != null && visib >= 10) visib = "10+";
              const wspdKmh = v(p.windSpeed);
              const wgstKmh = v(p.windGust);
              const clouds = (p.cloudLayers || []).map((c) => ({
                cover: c.amount,
                base:
                  c.base && c.base.value != null
                    ? Math.round(c.base.value * 3.28084)
                    : null,
              }));
              const ts = p.timestamp ? Date.parse(p.timestamp) : Date.now();
              const coords = j.geometry && j.geometry.coordinates;
              const slpPa = v(p.seaLevelPressure);
              const baroPa = v(p.barometricPressure);
              return {
                icaoId: id,
                rawOb: raw,
                temp: v(p.temperature),
                dewp: v(p.dewpoint),
                wdir: v(p.windDirection),
                wspd: wspdKmh == null ? null : Math.round(wspdKmh / 1.852),
                wgst: wgstKmh == null ? null : Math.round(wgstKmh / 1.852),
                visib,
                altim:
                  slpPa != null
                    ? slpPa / 100
                    : baroPa != null
                      ? baroPa / 100
                      : altimFromRaw(raw),
                clouds,
                cover: clouds[0]?.cover || "CLR",
                lat: coords ? coords[1] : null,
                lon: coords ? coords[0] : null,
                obsTime: Math.floor(ts / 1000),
                reportTime: p.timestamp || new Date(ts).toISOString(),
                name: id,
                wxString: p.textDescription || null,
              };
            }),
          );
          return rows.filter(Boolean);
        }

        function formatTaf(text, icao) {
          const lines = text
            .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, "")
            .replace(/\r/g, "")
            .split("\n")
            .map((l) => l.trim())
            .filter(Boolean)
            .filter(
              (l) =>
                !/^(NNN+|000|\d{3})$/.test(l) &&
                !/^FT[A-Z]{2}\d{2}\b/.test(l) &&
                !new RegExp("^TAF" + icao.slice(-3) + "$", "i").test(l),
            );
          const start = lines.findIndex(
            (l) =>
              /^(TAF(\s+AMD|\s+COR)?)\b/i.test(l) ||
              new RegExp("^(TAF\\s+(AMD\\s+|COR\\s+)?)?" + icao + "\\b", "i").test(l),
          );
          let joined = (start >= 0 ? lines.slice(start) : lines).join(" ");
          joined = joined.replace(/\s+/g, " ").trim();
          if (!joined) return "";
          if (!/^TAF\b/i.test(joined)) joined = "TAF " + joined;
          joined = joined.replace(/\s*=\s*$/, "=");
          joined = joined.replace(
            /\s+(FM\d{6}|BECMG\s+\d{4}\/\d{4}|BECMG\s+\d{4}(?!\d)|TEMPO\s+\d{4}\/\d{4}|PROB\d{2}(?:\s+\d{4}\/\d{4})?)/g,
            "\n     $1",
          );
          return joined;
        }

        function issueTimeFromTaf(raw) {
          const m = /\b(\d{2})(\d{2})(\d{2})Z\b/.exec(raw || "");
          if (!m) return null;
          const now = new Date();
          const dt = new Date(
            Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), Number(m[1]), Number(m[2]), Number(m[3])),
          );
          return dt.toISOString();
        }

        async function tafs(ids) {
          const list = ids.split(",").map((s) => s.trim().toUpperCase()).filter(Boolean);
          return Promise.all(
            list.map(async (id) => {
              const pil = "TAF" + (id.startsWith("K") && id.length === 4 ? id.slice(1) : id);
              const r = await orig(
                `https://mesonet.agron.iastate.edu/cgi-bin/afos/retrieve.py?fmt=text&pil=${encodeURIComponent(pil)}`,
              );
              if (!r.ok) return { icaoId: id, rawTAF: "", issueTime: null };
              const rawTAF = formatTaf(await r.text(), id);
              return { icaoId: id, rawTAF, issueTime: issueTimeFromTaf(rawTAF) };
            }),
          );
        }

        const isAwc = (url) =>
          url.includes("aviationweather.gov") || url.includes("/api/awc");

        window.fetch = async function (input, init) {
          const url = typeof input === "string" ? input : input && input.url ? input.url : "";
          try {
            if (isAwc(url) && url.includes("/metar")) return json(await metars(idsOf(url)));
            if (isAwc(url) && url.includes("/taf")) return json(await tafs(idsOf(url)));
            if (isAwc(url) && url.includes("/airsigmet")) return json([]);
          } catch (err) {
            return json({ error: String(err) }, 502);
          }
          return orig(input, init);
        };
      })();
    </script>

    <link rel="stylesheet" crossorigin href="./dist/assets/index-B9rkFgCl.css">

  </head>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./dist/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Weather standby console — METAR/TAF board, mission thresholds, WWA log, and brief builder."
    />
    <title>Stand-By Console</title>
    <script>
      (() => {
        const orig = window.fetch.bind(window);
        const PROXY = "https://cors.eu.org/";

        function formatTafBody(text) {
          let joined = String(text || "")
            .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, "")
            .replace(/\s+/g, " ")
            .replace(/^TAF\s+(TAF\b)/i, "$1")
            .trim();
          if (!joined) return "";
          if (!/^TAF\b/i.test(joined)) joined = "TAF " + joined;
          joined = joined.replace(/\s*=\s*$/, "=");
          return joined.replace(
            /\s+(FM\d{6}|BECMG\s+\d{4}\/\d{4}|BECMG\s+\d{4}(?!\d)|TEMPO\s+\d{4}\/\d{4}|PROB\d{2}(?:\s+\d{4}\/\d{4})?)/g,
            "\n     $1",
          );
        }

        window.fetch = async function (input, init) {
          const url = typeof input === "string" ? input : input && input.url ? input.url : "";
          if (url.includes("aviationweather.gov") && !url.startsWith(PROXY)) {
            const res = await orig(PROXY + url, init);
            if (url.includes("/taf") && res.ok) {
              try {
                const data = await res.clone().json();
                if (Array.isArray(data)) {
                  const formatted = data.map((row) =>
                    row && row.rawTAF
                      ? { ...row, rawTAF: formatTafBody(row.rawTAF) }
                      : row,
                  );
                  return new Response(JSON.stringify(formatted), {
                    status: res.status,
                    statusText: res.statusText,
                    headers: { "Content-Type": "application/json" },
                  });
                }
              } catch (_) {}
            }
            return res;
          }
          return orig(input, init);
        };
      })();
    </script>
    <script type="module" crossorigin src="./dist/assets/index-D3QOWLM3.js"></script>
    <link rel="stylesheet" crossorigin href="./dist/assets/index-B9rkFgCl.css">
    <link rel="stylesheet" href="./theme-overlay.css">
  </head>
  <body>
    <a class="wx-home-link" href="../">← wx-tools</a>
    <div id="root"></div>
    <script>
      (() => {
        const order = ["METWATCH", "Products", "Thresholds", "WWA Log", "Brief", "Shift Log"];
        function fixTabs() {
          const bar = document.querySelector(".tab-bar");
          if (!bar) return;
          const tabs = Array.from(bar.querySelectorAll(".tab"));
          if (!tabs.length) return;
          tabs.forEach((t) => {
            const text = t.textContent.trim();
            if (text === "Met Watch") t.textContent = "METWATCH";
          });
          const byLabel = {};
          Array.from(bar.querySelectorAll(".tab")).forEach((t) => {
            byLabel[t.textContent.trim()] = t;
          });
          if (byLabel["METWATCH"] && byLabel["Products"]) {
            order.forEach((label) => {
              const el = byLabel[label];
              if (el) bar.appendChild(el);
            });
          }
        }
        const obs = new MutationObserver(fixTabs);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        setInterval(fixTabs, 500);
      })();
    </script>
  </body>
</html>

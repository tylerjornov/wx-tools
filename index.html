<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wx-tools</title>
<meta name="description" content="Aviation and MWO field utilities.">
<meta name="theme-color" content="#0b1214">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1214'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='none' stroke='%235ee0b8' stroke-width='1.75'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' fill='none' stroke='%237ef0d0' stroke-width='1.75'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' fill='none' stroke='%237ef0d0' stroke-width='1.75'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' fill='none' stroke='%235ee0b8' stroke-width='1.75'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1214;
    --surface: #121c1f;
    --text: #e6f0ec;
    --accent: #5ee0b8;
    --muted: #8aa39a;
    --divider: color-mix(in srgb, #e6f0ec 16%, transparent);
    --shadow: 0 0 0 1px #2a403c, 0 6px 18px rgba(0,0,0,0.55);
    --shadow-sm: 0 0 0 1px #1e2f2c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    font-family: "Inter", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 16px;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

  .wrap { width: 100%; max-width: 560px; }
  .kicker {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.7rem, 4vw, 2rem);
    font-weight: 500;
    line-height: 1.12;
    letter-spacing: -0.015em;
    text-wrap: balance;
    color: var(--text);
  }
  .lede {
    margin: 0 0 22px;
    color: color-mix(in srgb, var(--text) 55%, transparent);
    max-width: 42ch;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }
  .tile {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px;
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    min-height: 120px;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  a.tile:hover {
    background: color-mix(in srgb, var(--accent) 8%, var(--surface));
  }
  .tile.soon {
    opacity: 0.45;
    cursor: default;
  }
  .icon {
    width: 28px;
    height: 28px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .icon svg { width: 100%; height: 100%; }
  .name {
    font-weight: 500;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .desc {
    font-size: 13px;
    color: var(--muted);
  }
  .live { position: relative; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Field utilities</p>
    <h1>wx-tools</h1>
    <p class="lede">Lightweight pages for MWO changeover timing and weather standby watch.</p>
    <div class="grid" role="list">
      <a class="tile live" role="listitem" href="./mwo-changeover-calculator/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
          </svg>
        </span>
        <span class="name">Changeover</span>
        <span class="desc">Split shift midpoint</span>
      </a>
      <a class="tile live" role="listitem" href="./weather-standby/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16a4 4 0 1 1 1.2-7.8A5 5 0 0 1 17.5 10 3.5 3.5 0 1 1 17 16Z"/>
          </svg>
        </span>
        <span class="name">Standby Dashboard</span>
        <span class="desc">METAR/TAF watch board</span>
      </a>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
    </div>
  </div>
</body>
</html>

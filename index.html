<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wx-tools</title>
<meta name="description" content="Aviation and MWO field utilities.">
<meta name="theme-color" content="#161826">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161826'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%239184d9' stroke-width='1.75'/%3E%3Cpath d='M16 8v8l5.5 3' fill='none' stroke='%23a7a1db' stroke-width='1.75' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #161826;
    --surface: #232532;
    --text: #e9e9ed;
    --accent: #9184d9;
    --muted: #9397ab;
    --divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --shadow: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
    --shadow-sm: 0 0 0 1px #3f424d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    font-family: "Inter", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 16px;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

  .wrap { width: 100%; max-width: 560px; }
  .kicker {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.7rem, 4vw, 2rem);
    font-weight: 500;
    line-height: 1.12;
    letter-spacing: -0.015em;
    text-wrap: balance;
    color: var(--text);
  }
  .lede {
    margin: 0 0 22px;
    color: color-mix(in srgb, var(--text) 55%, transparent);
    font-size: 14px;
    line-height: 1.45;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    min-height: 148px;
    padding: 16px;
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
  }
  .icon {
    display: grid;
    place-items: center;
    width: 36px; height: 36px;
    border-radius: 8px;
  }
  .icon svg { width: 18px; height: 18px; display: block; }
  .name { font-size: 15px; font-weight: 500; letter-spacing: -0.015em; }
  .desc { font-size: 12px; line-height: 1.35; color: color-mix(in srgb, var(--text) 50%, transparent); }

  a.live {
    background: var(--surface);
    box-shadow: var(--shadow);
    transition: transform 0.16s ease;
  }
  a.live::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
  }
  a.live .icon { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  a.live:hover { transform: translateY(-1px); }
  a.live:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .soon {
    background: color-mix(in srgb, var(--text) 4%, var(--bg));
    box-shadow: var(--shadow-sm);
    color: var(--muted);
    opacity: 0.55;
    filter: grayscale(0.35);
    pointer-events: none;
    user-select: none;
  }
  .soon .icon { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--muted); }
  .soon .desc { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    a.live { transition: none; }
    a.live:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">wx-tools</p>
    <h1>Field utilities</h1>
    <p class="lede">Pick a tool. More are on the way.</p>

    <div class="grid" role="list">
      <a class="tile live" role="listitem" href="./mwo-changeover-calculator/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </span>
        <span class="name">Changeover</span>
        <span class="desc">Split shift midpoint</span>
      </a>
      <a class="tile live" role="listitem" href="./weather-standby/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16a4 4 0 1 1 1.2-7.8A5 5 0 0 1 17.5 10 3.5 3.5 0 1 1 17 16Z"/>
          </svg>
        </span>
        <span class="name">Standby Dashboard</span>
        <span class="desc">METAR/TAF watch board</span>
      </a>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wx-tools</title>
<meta name="description" content="Aviation and MWO field utilities.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1020'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%235eead4' stroke-width='2'/%3E%3Cpath d='M16 7v9l6.5 3.5' fill='none' stroke='%23a5b4fc' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0b1020;
    color: #e9eef7;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 16px;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(129, 140, 248, 0.35), transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, rgba(45, 212, 191, 0.30), transparent 55%),
      radial-gradient(900px 900px at 50% 120%, rgba(236, 72, 153, 0.22), transparent 60%),
      linear-gradient(160deg, #0b1020 0%, #131a36 45%, #0d1430 100%);
    background-attachment: fixed;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 480px; height: 480px;
    top: -120px; left: -100px;
    background: radial-gradient(circle at 30% 30%, #818cf8, transparent 70%);
    animation: drift1 18s ease-in-out infinite alternate;
  }
  body::after {
    width: 520px; height: 520px;
    bottom: -160px; right: -120px;
    background: radial-gradient(circle at 70% 70%, #2dd4bf, transparent 70%);
    animation: drift2 22s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(60px, 40px) scale(1.15); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(-50px, -30px) scale(1.1); }
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 560px; }
  .kicker {
    margin: 0 0 8px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: lowercase;
    color: #5eead4;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.7rem, 4vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    text-wrap: balance;
    background: linear-gradient(90deg, #a5b4fc, #5eead4 60%, #fda4af);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lede {
    margin: 0 0 28px;
    color: #9fb0cc;
    font-size: 0.95rem;
    line-height: 1.45;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    min-height: 148px;
    padding: 18px 16px 16px;
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
  }
  .icon {
    display: grid;
    place-items: center;
    width: 36px; height: 36px;
    border-radius: 10px;
  }
  .icon svg { width: 20px; height: 20px; display: block; }
  .name { font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; }
  .desc { font-size: 0.78rem; line-height: 1.35; color: #9fb0cc; }

  a.live {
    background: rgba(30, 41, 59, 0.78);
    border: 1px solid rgba(148, 163, 184, 0.22);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.32), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.18s ease, box-shadow 0.18s ease;
  }
  a.live::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #818cf8, #2dd4bf);
  }
  a.live .icon { background: rgba(45, 212, 191, 0.14); color: #5eead4; }
  a.live:hover {
    transform: translateY(-2px);
    border-color: rgba(94, 234, 212, 0.45);
    box-shadow: 0 18px 40px rgba(45, 212, 191, 0.16);
  }
  a.live:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.28);
  }

  .soon {
    background: rgba(15, 23, 42, 0.42);
    border: 1px dashed rgba(148, 163, 184, 0.22);
    color: #7b8aa3;
    opacity: 0.55;
    filter: grayscale(0.45);
    pointer-events: none;
    user-select: none;
  }
  .soon .icon { background: rgba(148, 163, 184, 0.08); color: #8b9bb3; }
  .soon .desc { color: #6b7a94; }

  @media (prefers-reduced-motion: reduce) {
    body::before, body::after { animation: none; }
    a.live { transition: none; }
    a.live:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">wx-tools</p>
    <h1>Field utilities</h1>
    <p class="lede">Pick a tool. More are on the way.</p>

    <div class="grid" role="list">
      <a class="tile live" role="listitem" href="./mwo-changeover-calculator/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </span>
        <span class="name">Changeover</span>
        <span class="desc">Split shift midpoint</span>
      </a>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">

            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>
        <span class="desc">Not available yet</span>
      </div>
      <div class="tile soon" role="listitem" aria-disabled="true">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>
          </svg>
        </span>
        <span class="name">Coming soon</span>

      </div>
    </div>
  </div>
</body>
</html>
